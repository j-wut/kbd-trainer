name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install SDL3 build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
          wayland-protocols libegl-dev libgl-dev libasound2-dev libpulse-dev \
          libudev-dev libdbus-1-dev

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - name: Package
      run: tar -czf KBDTrainer-linux-x86_64.tar.gz -C bin .

    - uses: actions/upload-artifact@v4
      with:
        name: KBDTrainer-linux-x86_64
        path: KBDTrainer-linux-x86_64.tar.gz

  windows:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build --config Release

    # The exe must start on its own: no DLLs or assets folder next to it
    - name: Check the exe runs by itself
      shell: pwsh
      run: |
        $dir = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\solo"
        Copy-Item bin\KBDTrainer.exe $dir
        $env:SDL_VIDEO_DRIVER = "offscreen"
        $env:SDL_AUDIO_DRIVER = "dummy"
        $p = Start-Process "$dir\KBDTrainer.exe" -WorkingDirectory $dir -PassThru -NoNewWindow
        # The game exits with an error if SDL or an asset fails to load
        Start-Sleep -Seconds 5
        if ($p.HasExited) { Write-Error "KBDTrainer exited early with code $($p.ExitCode)"; exit 1 }
        Stop-Process -Id $p.Id

    - uses: actions/upload-artifact@v4
      with:
        name: KBDTrainer-windows-x64
        path: bin/KBDTrainer.exe
